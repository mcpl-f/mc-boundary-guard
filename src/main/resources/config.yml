# Avoids spamming the warning on every PlayerMoveEvent.
message-cooldown-millis: 500.0

# Used when player locale is unsupported or message is missing.
default-locale: ru

# Rules decide when restrictions are lifted.
# `all` requires every listed condition; `any` requires at least one.
# `in-spawn-radius` is met while the player is within that distance of the
# anchor - normal worlds use world spawn, Nether divides this value by 8, and
# The End uses this value from real 0,0 (see domain/BoundaryArea). It's the
# single source of truth for "the spawn area": `keep-on-spawn` (below) confines
# movement to this same area rather than taking its own separate radius.
#
# Example: require both Telegram linking and 2.5 hours played:
# condition:
#   all:
#     - tg-linking-check: true
#     - time-played-limit:
#         hours: 2.5
# Example: accept either Telegram linking OR 2.5 hours played:
# condition:
#   any:
#     - tg-linking-check: true
#     - time-played-limit:
#         hours: 2.5
# Example: at least 1 hour played AND (Telegram linked OR 2.5 hours played):
# condition:
#   all:
#     - time-played-limit:
#         hours: 1.0
#     - any:
#         - tg-linking-check: true
#         - ds-linking-check: true # not implemented yet, just for example
#
rules:
  # Unrestricted once linked, OR simply while standing inside the spawn area -
  # no need to link Telegram just to putter around at spawn.
  condition:
    any:
      - tg-linking-check: true
      - in-spawn-radius: 2048

  strategies:
    # Plain on/off toggles: the area they act on is always the same
    # in-spawn-radius above, so there is nothing left to configure per-strategy.
    # keep-on-spawn: true

    # Uncomment to also (or instead) switch restricted players to Adventure Mode.
    switch-2-adventure-mode: true

    # Uncomment to prevent restricted players from using containers.
    # forbid-container-use: true

# How often (in ticks) restriction state is re-checked for online players.
restriction-refresh-interval-ticks: 60

# How long (in milliseconds) a "not yet linked" Telegram lookup is cached before
# re-checking tg-bridge for that player.
telegram-recheck-cooldown-millis: 300

# How often (in seconds) a restricted player still gets reminded what they need
# to satisfy, even if they're standing still and not triggering anything else.
# Set enabled to false to turn this reminder off entirely.
condition-reminder:
  interval-seconds: 4
  enabled: true

  
messages:
  en:
    # Connector words used to assemble a warning from the pieces below at send
    # time: "and"/"or" join multiple reasons (matching all/any); "before" attaches
    # the restriction to a reactive "you just got blocked" message (as a bare
    # connector - the restriction phrase itself supplies the gerund right after
    # it, e.g. "before leaving the spawn area"), "so-that" to a proactive
    # reminder (as "so that you can" - that phrasing needs a bare infinitive
    # after it instead, e.g. "so that you can leave the spawn area").
    join:
      and: "and"
      or: "or"
      before: "before"
      so-that: "so that you can"

    # One entry per ConditionReason: what the player needs to do. `command`/`hover`
    # are optional - only a reason that's an actual runnable command gets them
    # (and becomes a clickable, green button); a reason that's just advice (like
    # playtime) only has a `label` and stays plain text.
    reasons:
      tg-linking:
        label: "[Bind Telegram - /tg account register]"
        command: "/tg account register"
        hover: "Run /tg account register"
      playtime:
        label: "play longer on the server"
      # Satisfying rules.condition via in-spawn-radius isn't durable (stepping
      # back out re-triggers the same block), but it's still a real, always-
      # available alternative worth naming - except in the boundary-blocked
      # message itself, where it's excluded (see reasonMessage in
      # MinecraftMessageService) because "return to spawn" as the fix for
      # "you can't leave the spawn area" is circular.
      return-to-spawn:
        label: "[Return to spawn - /tgspawn]"
        command: "/tgspawn"
        hover: "Run /tgspawn"

    # What's currently blocked, named per calling context (boundary/container/
    # condition-reminder). Each restriction needs both an English gerund (after
    # the bare "before") and an infinitive (after "so that you can") - Russian
    # doesn't need the split (both its connectors take a bare infinitive), so it
    # repeats the same text under both keys.
    restrictions:
      leave-spawn:
        gerund: "leaving the spawn area"
        infinitive: "leave the spawn area"
      use-containers:
        gerund: "using containers"
        infinitive: "use containers"
      interact-freely:
        gerund: "interacting with the world freely"
        infinitive: "interact with the world freely"


    # Replies from the /tgspawn command.
    tgspawn-command:
      teleported: "Teleported to the allowed spawn area."
      already-in-area: "You are already inside the allowed spawn area."
      only-player: "Only players can use this command."


  ru:
    join:
      and: "и"
      or: "или"
      before: "перед тем как"
      so-that: "чтобы"

    reasons:
      tg-linking:
        label: "[Привязать Telegram - /tg account register]"
        command: "/tg account register"
        hover: "Выполнить /tg account register"
      playtime:
        label: "играть дольше на сервере"
      return-to-spawn:
        label: "[Вернуться на спавн - /tgspawn]"
        command: "/tgspawn"
        hover: "Выполнить /tgspawn"

    restrictions:
      leave-spawn:
        gerund: "выйти со спавна"
        infinitive: "выйти со спавна"
      use-containers:
        gerund: "пользоваться контейнерами"
        infinitive: "пользоваться контейнерами"
      interact-freely:
        gerund: "свободно взаимодействовать с миром"
        infinitive: "свободно взаимодействовать с миром"


    tgspawn-command:
      teleported: "Телепортирован в разрешенную зону спавна."
      already-in-area: "Ты уже находишься в разрешенной зоне спавна."
      only-player: "Эту команду может использовать только игрок."
