# Avoids spamming the warning on every PlayerMoveEvent.
message-cooldown-millis: 500.0

# How often (in ticks) restriction state is re-checked for online players, and how
# long a "not yet linked" Telegram lookup is cached before re-checking tg-bridge.
telegram-check-interval-ticks: 60

# Used when player locale is unsupported or message is missing.
default-locale: ru

# Rules decide when restrictions are lifted.
# `all` requires every listed condition; `any` requires at least one.
# Example: require both Telegram linking and 2.5 hours played:
# condition:
#   all:
#     - tg-linking-check: true
#     - time-played-limit:
#         hours: 2.5
# Example: accept either Telegram linking OR 2.5 hours played:
# condition:
#   any:
#     - tg-linking-check: true
#     - time-played-limit:
#         hours: 2.5
# Example: at least 1 hour played AND (Telegram linked OR 2.5 hours played):
# condition:
#   all:
#     - time-played-limit:
#         hours: 1.0
#     - any:
#         - tg-linking-check: true
#         - ds-linking-check: true # not implemented yet, just for example
#
rules:
  condition:
    all:
      - tg-linking-check: true

  strategies:
    # Distance from the anchor where unbound players are allowed to move.
    # Normal worlds use world spawn, Nether uses this value divided by 8,
    # and The End uses this value from 0,0.
    keep-on-spawn:
      radius: 2048.0

    # Uncomment the block to enable Adventure Mode while restricted.
    # Set everywhere to true to apply in every world; false will switch to
    # adventure only once the player is outside of the specified radius
    # (same Nether/End scaling as keep-on-spawn's radius above).
    # switch-2-adventure-mode:
    #   everywhere: false
    #   only-outside-of-radius: 512.0

    # Uncomment to prevent restricted players from using containers.
    # forbid-container-use: true

messages:
  en:
    blocked: "Bind your Minecraft account to Telegram before leaving spawn."
    container-blocked: "Link your Telegram account before using containers."
    bind-button: "[Bind Telegram - /tg account register]"
    bind-hover: "Run /tg account register"
    spawn-button: "[Teleport to spawn - /tgspawn]"
    spawn-hover: "Run /tgspawn"
    teleported: "Teleported to the allowed spawn area."
    already-in-area: "You are already inside the allowed spawn area."
    only-player: "Only players can use this command."
  ru:
    blocked: "Привяжи Minecraft аккаунт к Telegram перед выходом со спавна."
    container-blocked: "Привяжи Telegram, чтобы пользоваться контейнерами."
    bind-button: "[Привязать Telegram - /tg account register]"
    bind-hover: "Выполнить /tg account register"
    spawn-button: "[Телепорт на спавн - /tgspawn]"
    spawn-hover: "Выполнить /tgspawn"
    teleported: "Телепортирован в разрешенную зону спавна."
    already-in-area: "Ты уже находишься в разрешенной зоне спавна."
    only-player: "Эту команду может использовать только игрок."
