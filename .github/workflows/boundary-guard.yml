name: Boundary Guard CI

on:
  push:
    paths:
      - 'pom.xml'
      - '.github/workflows/boundary-guard.yml'
      - 'src/**'
  pull_request:
    paths:
      - 'pom.xml'
      - '.github/workflows/boundary-guard.yml'
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Boundary Guard
        run: mvn package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tg-bridge-boundary-guard.jar
          path: target/tg-bridge-boundary-guard-*.jar
